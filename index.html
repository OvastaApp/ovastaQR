<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حمّل تطبيق أوفاستا</title>
<meta name="robots" content="noindex">
<script>
  (function () {
    var ANDROID = "https://play.google.com/store/apps/details?id=com.ovasta&hl=en";
    var IOS = "https://apps.apple.com/eg/app/ovasta/id1546769921";
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS 13+
    var isAndroid = /Android/i.test(ua);
    if (isIOS) location.replace(IOS);
    else if (isAndroid) location.replace(ANDROID);
  })();
</script>
<style>
  :root { --g:#2B8761; --gd:#1F6B4C; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#fff; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; color:var(--gd) }
  main { text-align:center; padding:32px 16px; max-width:420px; width:100% }
  h1 { font-size:24px; margin:0 0 8px }
  p  { margin:0 0 24px; color:#4a6b5d }
  a.btn { display:block; margin:12px 0; padding:16px; border-radius:999px; background:var(--g);
          color:#fff; text-decoration:none; font-weight:700; font-size:18px }
  a.btn.alt { background:#fff; color:var(--g); border:2px solid var(--g) }
</style>
</head>
<body>
<main>
  <h1>أوفاستا.. دليفري على الرايق</h1>
  <p>حمّل التطبيق من المتجر المناسب لموبايلك</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.ovasta&hl=en">Google Play — أندرويد</a>
  <a class="btn alt" href="https://apps.apple.com/eg/app/ovasta/id1546769921">App Store — آيفون</a>
</main>
</body>
</html>
